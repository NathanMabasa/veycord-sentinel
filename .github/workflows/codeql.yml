name: CodeQL security analysis
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '20 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: CodeQL JavaScript and TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize analysis
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4 upstream commit, verified 2026-10-25
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: ./.github/codeql/config.yml
      - name: Analyze source
        id: analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:javascript-typescript
      - name: Verify security gate behavior
        run: python3 scripts/test_sarif_gate.py
      - name: Reject high and critical security findings
        env:
          SENTINEL_SARIF_DIRECTORY: ${{ steps.analysis.outputs.sarif-output }}
        run: python3 scripts/check_sarif.py "$SENTINEL_SARIF_DIRECTORY"
