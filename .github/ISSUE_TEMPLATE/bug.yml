name: Bug report
description: Report a reproducible problem using synthetic data only.
body:
  - type: markdown
    attributes:
      value: 'For a security vulnerability, use the private reporting process in SECURITY.md. Never attach credentials, .env files, database archives, or customer records.'
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the route, version, environment and synthetic steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Remove personal information and secrets before attaching logs or screenshots.
